<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Steel Utensils Dispatch Book</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", Arial, sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background:
          radial-gradient(circle at top, rgba(245, 158, 11, 0.16), transparent 30%),
          linear-gradient(180deg, #eff6ff 0%, #dbeafe 42%, #bfdbfe 100%);
        color: #0f172a;
      }

      .shell {
        width: min(460px, calc(100vw - 32px));
        padding: 32px 28px;
        border-radius: 24px;
        border: 1px solid rgba(30, 64, 175, 0.12);
        background: rgba(255, 255, 255, 0.94);
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
      }

      .eyebrow {
        margin: 0 0 10px;
        font-size: 11px;
        font-weight: 800;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: #1d4ed8;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
      }

      p {
        margin: 12px 0 0;
        font-size: 15px;
        line-height: 1.6;
        color: #334155;
      }

      .status {
        margin-top: 24px;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 14px 16px;
        border-radius: 16px;
        background: #eff6ff;
        color: #1e3a8a;
      }

      .spinner {
        width: 18px;
        height: 18px;
        border-radius: 999px;
        border: 2px solid rgba(30, 64, 175, 0.2);
        border-top-color: #1d4ed8;
        animation: spin 0.8s linear infinite;
        flex: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <p class="eyebrow">Offline Billing App</p>
      <h1>Steel Utensils Dispatch Book</h1>
      <p>Preparing local billing data and opening your workspace.</p>
      <div class="status">
        <div class="spinner" aria-hidden="true"></div>
        <strong>Starting application...</strong>
      </div>
    </main>
  </body>
</html>
