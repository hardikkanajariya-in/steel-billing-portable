directories:
  output: release
  buildResources: build
appId: in.hardikkanajariya.steelutensilsdispatchbook
productName: Steel Utensils Dispatch Book
asar: true
files:
  - filter:
      - dist/**/*
      - electron/**/*
      - package.json
      - node_modules/sql.js/dist/sql-wasm.wasm
extraResources:
  - from: node_modules/sql.js/dist/sql-wasm.wasm
    to: sql-wasm.wasm
win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  artifactName: SteelUtensilsDispatchBook-Setup-${version}.${ext}
  oneClick: false
  allowToChangeInstallationDirectory: true
portable:
  artifactName: SteelUtensilsDispatchBook-Portable-${version}.${ext}
electronVersion: 41.3.0
